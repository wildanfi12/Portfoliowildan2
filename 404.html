<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <title>Halaman tidak ditemukan — Wildan Portfolio</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #111; background: #f6f5f2; }
    main { width: min(100%, 620px); padding: clamp(32px, 7vw, 64px); border: 1px solid #dedcd7; border-radius: 32px; background: rgba(255,255,255,.86); box-shadow: 0 24px 80px rgba(10,10,10,.08); }
    span { color: #b15f2c; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; font-size: clamp(42px, 10vw, 72px); line-height: .95; letter-spacing: -.055em; }
    p { margin: 0 0 28px; color: #646464; line-height: 1.65; }
    a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 22px; border-radius: 999px; color: #fff; background: #111; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b15f2c; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span>Error 404</span>
    <h1>Halaman tidak ditemukan.</h1>
    <p>Alamat yang dibuka mungkin sudah berubah atau tidak tersedia. Kembali ke halaman utama untuk melihat karya terbaru.</p>
    <a href="/">Kembali ke portfolio</a>
  </main>
</body>
</html>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pratinjau website</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{background:#070707;color:#fff}#viewport{width:100%;height:100%;overflow:hidden}.tour{height:300vh;display:flex;flex-direction:column;animation:tour 22s cubic-bezier(.45,0,.2,1) infinite;animation-play-state:paused}.tour.active{animation-play-state:running}.screen{position:relative;flex:none;width:100%;height:100vh;overflow:hidden;padding:7vh 7vw}
@keyframes tour{0%,10%{transform:translateY(0)}78%,90%{transform:translateY(-66.6667%)}100%{transform:translateY(0)}}
.brand{font-weight:800;letter-spacing:.04em;font-size:clamp(20px,3vw,45px)}.eyebrow{font-size:clamp(10px,1vw,16px);letter-spacing:.18em;text-transform:uppercase;opacity:.75}.title{font-size:clamp(30px,5vw,76px);line-height:.98;letter-spacing:-.045em;margin:.35em 0}.copy{font-size:clamp(14px,1.55vw,24px);line-height:1.55;max-width:38em}.screen-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080808dd,#08080870 55%,#08080835)}.hero-copy{position:relative;z-index:1;max-width:58%}.pill{display:inline-flex;margin-top:1.4em;padding:.8em 1.25em;border-radius:999px;font-size:clamp(12px,1.2vw,18px);font-weight:700;background:#ffd400;color:#111}
.spin{background:#050505}.spin .hero-copy{padding-top:3vh}.spin .screen-shot{object-fit:contain;opacity:.94}.panel{background:#141414ef;border:1px solid #ffffff22;border-radius:18px;padding:clamp(18px,3vw,46px);max-width:820px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.item{padding:18px 12px;border-radius:12px;background:#fff;color:#111;text-align:center;font-size:clamp(12px,1.4vw,20px);font-weight:700}
.catch{background:radial-gradient(circle at 75% 25%,#146fc9,#07162f 60%,#040914)}.catch .screen-shot{object-fit:cover;opacity:.32}.catch .hero-copy{max-width:72%}.game-ui{position:absolute;right:7vw;bottom:8vh;width:29vw;min-width:210px;padding:20px;border-radius:20px;background:#07111ee8;border:1px solid #75b8ff55;box-shadow:0 20px 60px #0008}.game-top{display:flex;justify-content:space-between;color:#9fd2ff}.game-field{height:23vh;min-height:120px;margin:15px 0;border-radius:12px;background:radial-gradient(circle at 40% 40%,#6bbcff,#1756a5 25%,#0d2b56 70%);position:relative}.game-field:after{content:'✦';position:absolute;left:45%;top:35%;font-size:42px;color:#ffd400}.score{font-size:clamp(24px,3vw,44px);font-weight:800}
.bakery{background:#f7e8d9;color:#492c22}.bakery .screen-shot{opacity:.38}.bakery .shade{background:linear-gradient(90deg,#f7e8d9f5,#f7e8d9a6 65%,transparent)}.bakery .pill{background:#9f4e35;color:#fff}.bakery .panel{background:#fff9;color:#492c22;border-color:#8c563322}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.product{background:#fff;border-radius:14px;padding:20px 12px;min-height:105px;display:grid;place-items:center;text-align:center;font-weight:700;color:#77432f}
.registration{background:#f4f4f1;color:#111}.registration .bar{height:10vh;margin:-7vh -7vw 7vh;background:#080808;display:flex;align-items:center;padding:0 7vw;color:white}.registration .panel{background:#fff;border:1px solid #ddd;box-shadow:0 14px 40px #0001;color:#222;width:min(780px,90%);margin:0 auto}.field{margin-top:15px;padding:13px 14px;border:1px solid #d7d7d2;border-radius:8px;color:#777;font-size:clamp(12px,1.25vw,18px)}.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.check{padding:8px 12px;border-radius:999px;background:#f3f3f0;font-size:clamp(10px,1vw,15px)}
@media(max-width:760px){.screen{padding:6vh 6vw}.hero-copy,.catch .hero-copy{max-width:90%}.screen-shot{object-position:center}.game-ui{right:6vw;bottom:6vh;width:38vw;min-width:170px;padding:13px}.registration .bar{margin:-6vh -6vw 5vh;padding:0 6vw}.products{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.tour{animation:none!important;transform:translateY(0)!important}}
</style></head><body><div id="viewport"><main class="tour" id="tour"></main></div>
<script>
const sites={
spin:{theme:'spin',image:'howell-spin-win.jpg',brand:'HOWELL',eyebrow:'Interactive campaign',title:'SPIN & WIN',copy:'Putar roda, isi energi, dan temukan hadiah Howell.',button:'TAHAN UNTUK MENGISI ENERGI',second:'PILIHAN HADIAH',third:'SIAP UNTUK BERMAIN?',detail:'Pengalaman campaign interaktif dengan roda hadiah, kontrol suara, histori, dan mode layar penuh.',items:['TWS HW01','Kaos Howell','Payung Howell','Kabel Data 4 in 1','Earphone HW03','Voucher diskon']},
catch:{theme:'catch',image:'howell-catch-win.jpg',brand:'HOWELL',eyebrow:'Mini game campaign',title:'CATCH & WIN',copy:'Tangkap sebanyak mungkin dalam tantangan singkat.',button:'MULAI BERMAIN',second:'PAPAN SKOR',third:'KOLEKSI HADIAH',detail:'Tantangan 30 detik, papan skor, koleksi skin, dan mode demo dengan hadiah simulasi.',items:['Tantangan 30 detik','Papan skor','Koleksi skin','Mode demo']},
bakery:{theme:'bakery',image:'nadia-bakery.jpg',brand:'Nadia Bakery',eyebrow:'Freshly baked · Est. 2005',title:'Hangat di setiap gigitan.',copy:'Temukan roti dan kue favorit untuk menemani harimu.',button:'LIHAT MENU',second:'DIBUAT DENGAN HANGAT',third:'PILIHAN FAVORIT',detail:'Cerita brand, katalog produk, galeri, dan cara pemesanan langsung.',items:['Roti Original','Roti Kering','Brownies','Pia']},
registration:{theme:'registration',image:'howell-indocomtech-registration.jpg',brand:'HOWELL',eyebrow:'Indocomtech 2026',title:'Registrasi pengunjung',copy:'Lengkapi data singkat untuk kunjungan Anda.',button:'DAFTAR SEKARANG',second:'INFORMASI PENGUNJUNG',third:'KEBUTUHAN PRODUK',detail:'Formulir ringkas untuk identitas, kategori pengunjung, perusahaan, dan kebutuhan produk.',items:['HDMI','LAN / Patch','DisplayPort','Power / PDU','USB / Data','Audio']}
};
const data=sites[new URLSearchParams(location.search).get('site')]||sites.spin;
const screenshot='<img class="screen-shot" src="'+data.image+'" alt="" loading="eager"><div class="shade"></div>';
const cards=data.items.map(x=>'<div class="item">'+x+'</div>').join('');
document.body.className=data.theme;
document.getElementById('tour').innerHTML=
'<section class="screen '+data.theme+'">'+screenshot+'<div class="hero-copy">'+(data.theme==='registration'?'<div class="bar"><span class="brand">'+data.brand+'</span></div>':'<div class="brand">'+data.brand+'</div>')+'<div class="eyebrow">'+data.eyebrow+'</div><h1 class="title">'+data.title+'</h1><p class="copy">'+data.copy+'</p><span class="pill">'+data.button+'</span></div>'+(data.theme==='catch'?'<div class="game-ui"><div class="game-top"><b>HOWELL CATCH & WIN</b><b>00:30</b></div><div class="game-field"></div><div class="score">SCORE&nbsp; 120</div></div>':'')+'</section>'+
'<section class="screen '+data.theme+'">'+(data.theme==='registration'?'<div class="bar"><span class="brand">'+data.brand+'</span></div>':'')+'<div class="panel"><div class="eyebrow">'+data.eyebrow+'</div><h2 class="title">'+data.second+'</h2><p class="copy">'+data.detail+'</p>'+(data.theme==='registration'?'<div class="field">Nama lengkap</div><div class="field">Nomor WhatsApp</div><div class="field">Nama perusahaan</div><div class="checks">'+data.items.map(x=>'<span class="check">＋ '+x+'</span>').join('')+'</div>':'<div class="items">'+cards+'</div>')+'</div></section>'+
'<section class="screen '+data.theme+'">'+screenshot+'<div class="shade"></div><div class="hero-copy"><div class="eyebrow">'+data.eyebrow+'</div><h2 class="title">'+data.third+'</h2><p class="copy">'+data.detail+'</p><span class="pill">'+data.button+'</span></div></section>';
window.addEventListener('message',event=>{if(event.data==='preview-play')document.getElementById('tour').classList.add('active');if(event.data==='preview-pause')document.getElementById('tour').classList.remove('active')});
</script></body></html>
